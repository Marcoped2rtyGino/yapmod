name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/**'
      - 'src/**'
      - 'src-tauri/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/**'
      - 'src/**'
      - 'src-tauri/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage

          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg

          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg

          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          rustflags: ''
          cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install modules
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          LINUXDEPLOY_EXCLUDED_LIBRARIES: libwayland-client.so.0,libwayland-cursor.so.0,libwayland-egl.so.1,libwayland-server.so.0,libxkbcommon.so.0,libxcb.so.1,libxcb-render.so.0,libxcb-shm.so.0,libxcb-randr.so.0,libXau.so.6,libXdmcp.so.6

      - name: (Linux) Create portable archive
        if: runner.os == 'Linux'
        run: tar -czvf src-tauri/target/${{ matrix.target }}/release/yapmod-portable.tar.gz -C src-tauri/target/${{ matrix.target }}/release yapmod

      - name: (Windows) Create portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "src-tauri/target/${{ matrix.target }}/release/yapmod.exe" -DestinationPath "src-tauri/target/${{ matrix.target }}/release/yapmod-portable.zip" -Force

      - name: (Linux) Upload portable
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: yapmod-${{ matrix.target }}-portable
          path: src-tauri/target/${{ matrix.target }}/release/yapmod-portable.tar.gz
          if-no-files-found: error

      - name: (Linux) Upload .deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: yapmod-${{ matrix.target }}-deb
          path: src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: (Linux) Upload .rpm
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: yapmod-${{ matrix.target }}-rpm
          path: src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error

      - name: (Linux) Verify AppImage excludes wayland libraries
        if: runner.os == 'Linux'
        run: |
          APPIMAGE=$(find src-tauri/target/${{ matrix.target }}/release/bundle/appimage -name '*.AppImage' | head -1)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract > /dev/null 2>&1
          squashfs_root=$(find . -name 'squashfs-root' -type d | head -1)
          EXCLUDED_LIBS=(
            libwayland-client.so.0
            libwayland-cursor.so.0
            libwayland-egl.so.1
            libwayland-server.so.0
            libxkbcommon.so.0
            libxcb.so.1
            libxcb-render.so.0
            libxcb-shm.so.0
            libxcb-randr.so.0
            libXau.so.6
            libXdmcp.so.6
          )
          FOUND=0
          for lib in "${EXCLUDED_LIBS[@]}"; do
            if find "$squashfs_root"/usr/lib/ -name "$lib" 2>/dev/null | grep -q .; then
              echo "ERROR: Found bundled $lib"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "AppImage still bundles wayland/display libraries!"
            exit 1
          fi
          echo "AppImage verification passed — no bundled wayland libraries."

      - name: (Linux) Upload .AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: yapmod-${{ matrix.target }}-appimage
          path: src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: (macOS) Upload .dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: yapmod-${{ matrix.target }}-dmg
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: (Windows) Upload portable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: yapmod-${{ matrix.target }}-portable
          path: src-tauri/target/${{ matrix.target }}/release/yapmod-portable.zip
          if-no-files-found: error

      - name: (Windows) Upload .msi
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: yapmod-${{ matrix.target }}-msi
          path: src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: (Windows) Upload .exe (NSIS)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: yapmod-${{ matrix.target }}-nsis
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
