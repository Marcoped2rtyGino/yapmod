name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (without the leading "v")'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # https://github.com/actions/upload-artifact/issues/21#issuecomment-2393490651
      - name: Download latest successful build artifacts
        run: |
          gh_last_success_run_id=$(gh run list -w $WORKFLOW --json conclusion,headBranch,databaseId --jq 'first(.[] | select(.conclusion | contains("success"))) | .databaseId')
          [ -z "$gh_last_success_run_id" ] && echo "No successful run found" && exit 1 || true
          gh run download $gh_last_success_run_id -D $OUTPUT_DIR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW: .github/workflows/build.yml
          OUTPUT_DIR: artifacts

      - name: Rename artifacts
        run: |
          mkdir -p renamed_artifacts

          for artifact_dir in artifacts/*/; do
            base_name=$(basename "$artifact_dir")

            # Determine the new filename based on the artifact name
            case "$base_name" in
              "yapmod-aarch64-apple-darwin-dmg")
                new_name="yapmod_${{ inputs.version }}_aarch64.dmg"
                ;;
              "yapmod-x86_64-apple-darwin-dmg")
                new_name="yapmod_${{ inputs.version }}_x64.dmg"
                ;;
              "yapmod-x86_64-pc-windows-msvc-nsis")
                new_name="yapmod_${{ inputs.version }}_x64-setup.exe"
                ;;
              "yapmod-x86_64-pc-windows-msvc-msi")
                new_name="yapmod_${{ inputs.version }}_x64_en-US.msi"
                ;;
              "yapmod-x86_64-pc-windows-msvc-portable")
                new_name="yapmod_${{ inputs.version }}_win64_portable.zip"
                ;;
              "yapmod-x86_64-unknown-linux-gnu-appimage")
                new_name="yapmod_${{ inputs.version }}_amd64.AppImage"
                ;;
              "yapmod-x86_64-unknown-linux-gnu-deb")
                new_name="yapmod_${{ inputs.version }}_amd64.deb"
                ;;
              "yapmod-x86_64-unknown-linux-gnu-rpm")
                new_name="yapmod_${{ inputs.version }}-1.x86_64.rpm"
                ;;
              "yapmod-x86_64-unknown-linux-gnu-portable")
                new_name="yapmod_${{ inputs.version }}_amd64_portable.tar.gz"
                ;;
              *)
                # Skip unknown artifacts
                continue
                ;;
            esac

            # Find the actual artifact file in the directory (assuming there's only one file)
            artifact_file=$(find "$artifact_dir" -type f -print -quit)

            if [ -n "$artifact_file" ]; then
              echo "Renaming $artifact_file to $new_name"
              # Copy and rename the file
              cp "$artifact_file" "renamed_artifacts/$new_name"
            fi
          done

      - name: Load release notes
        id: notes
        run: |
          notes_file=".github/release-notes/v${{ inputs.version }}.md"

          if [ -f "$notes_file" ]; then
            {
              echo "body<<YAPMOD_RELEASE_NOTES_EOF"
              cat "$notes_file"
              echo "YAPMOD_RELEASE_NOTES_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "body=If you can see this, I forgot to change the release description." >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: renamed_artifacts/*
          draft: true
