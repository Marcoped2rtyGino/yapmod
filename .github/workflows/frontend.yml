name: Check frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/frontend.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/**'
      - 'src/**'
      - 'src-tauri/injection/**'
      - 'index.html'
      - 'tsconfig.json'
      - 'vite.config.ts'
  pull_request:
    paths:
      - '.github/workflows/frontend.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/**'
      - 'src/**'
      - 'src-tauri/injection/**'
      - 'index.html'
      - 'tsconfig.json'
      - 'vite.config.ts'

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tsc-injection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install modules
        run: pnpm install --frozen-lockfile

      - name: Typecheck injection scripts
        run: pnpm injection:check

      - name: Build injection bundles
        run: pnpm injection:build

      - name: Typecheck and build frontend
        run: pnpm build
